name: Visual Test Format Closeout

on:
  push:
    branches: [prd-02-playable-core]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prd-02-playable-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --write e2e/visual-combat.spec.ts
      - name: Commit format-only test closeout
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- e2e/visual-combat.spec.ts)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add e2e/visual-combat.spec.ts
            git commit -m "style: format visual combat test"
            git push origin HEAD:prd-02-playable-core
          fi
